name = "waraqa"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# The app itself (index.html) is served as static assets; everything under /api/ goes to the Worker.
[assets]
directory = "."
binding = "ASSETS"

# Database id from Cloudflare dashboard > D1 > waraqa-db. Tables are created automatically on first use.
[[d1_databases]]
binding = "DB"
database_name = "waraqa-db"
database_id = "__D1_ID__"
migrations_dir = "migrations"

# Optional: add an R2 bucket with binding FILES (see SETUP.md). Without it, images are stored in D1.
