name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "::notice::ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "::notice::sdk ready"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KS_B64: ${{ secrets.WARAQA_KEYSTORE_B64 }}
        run: |
          echo "::notice::signing step"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/waraqa.jks"
            echo "WARAQA_KEYSTORE=$RUNNER_TEMP/waraqa.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          WARAQA_KS_PASS: ${{ secrets.WARAQA_KS_PASS }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Waraqa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Waraqa-apk
          path: Waraqa.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Waraqa.apk --title "ورقة لأندرويد" --notes "حمّل ملف Waraqa.apk وثبّته على جوالك. رقم الإصدار: 1.0.${{ github.run_number }}" --latest
      - name: Report errors as annotations
        if: failure()
        run: |
          touch build.log
          echo "::notice::log lines $(wc -l < build.log)"
          grep -nE "error:|What went wrong|FAILED|Could not|> .*failed|Exception" build.log | head -40 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
      - name: Share build log on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          gh release delete android-log --yes --cleanup-tag || true
          gh release create android-log build.log --title "Android build log" --notes "Build log for run ${{ github.run_number }}" --prerelease
