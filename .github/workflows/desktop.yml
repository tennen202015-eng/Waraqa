name: Windows EXE

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund 2>&1 | tail -20
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee ../build.log
          ls -la dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows desktop/dist/Waraqa-Setup.exe desktop/dist/Waraqa-Portable.exe --title "ورقة لويندوز" --notes "Waraqa-Setup.exe: برنامج تثبيت. Waraqa-Portable.exe: نسخة تعمل بدون تثبيت. رقم البناء: ${{ github.run_number }}" --latest=false
      - name: Report errors as annotations
        if: failure()
        run: |
          touch build.log
          grep -nE "error|Error|ERR!|failed|cannot" build.log | head -40 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
